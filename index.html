<!doctype html>
<html lang="en" class="scroll-smooth dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#08090b" />
  <meta name="color-scheme" content="dark" />
  <title>Kafeholic — Fine Dining Restaurant</title>
  <meta name="description"
    content="Experience an exquisite culinary symphony at Kafeholic. Curated seasonal ingredients, modern gastronomy, and timeless luxury ambiance." />

  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />

  <!-- Content Security Policy (CSP) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' data: https://images.unsplash.com https://*.google.com https://*.gstatic.com;
    frame-src 'self' https://www.google.com https://maps.google.com;
    connect-src 'self' https://images.unsplash.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self' https://wa.me;
  " />

  <link rel="preload" as="image" href="/src/assets/kafeholic-entrance-portrait.webp"
    media="(max-aspect-ratio: 4/5)" fetchpriority="high">

  <!-- Fast Handshakes for 4G & Mobile Networks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="dns-prefetch" href="https://images.unsplash.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body class="bg-[#08090b] text-[#edebe6] antialiased selection:bg-[#d4af37] selection:text-[#08090b]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
